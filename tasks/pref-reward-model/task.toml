schema_version = "1.3"

# Copied from the agent container into the verifier container at identical
# absolute paths. Nothing else crosses the boundary.
artifacts = ["/app/final_model", "/logs/agent/train_log.txt"]

[task]
name = "mleval/pref-reward-model"
version = "1.0.0"
description = """Post-train a small pretrained encoder (distilroberta-base, 82M) into a \
reward model over human preference pairs, under a CPU-only 4-hour budget. Scored by \
pairwise accuracy on private held-out prompts the agent never sees."""
authors = []
keywords = ["ml-engineering", "post-training", "rlhf", "reward-model", "cpu-only", "hh-rlhf"]

[metadata]
category = "ML"
subcategory = "Post-training"
compute = "1-gpu"
base_model = "distilroberta-base"
base_model_revision = "fb53ab8802853c8e4fbdbcd0529f21fc6f459b2b"
# Anchors are measured on the private split; see tests/grader/private/anchors.json.
# reward = mean over eval sets of clip((acc - base) / (reference - base), 0, 1)
reward_definition = "normalized recovery vs the frozen-encoder ceiling and a tuned fine-tune"

[agent]
timeout_sec = 14400  # 4h all-inclusive: setup, training, evaluation

[environment]
# The agent MAY download other preference data - that freedom is the point, and
# a better reward model built from other public preferences is a legitimate
# solution. What it may not do is fetch the corpus this split was drawn from;
# see rule 3 in instruction.md and the fingerprint check in tests/grade.py.
network_mode = "public"
build_timeout_sec = 1800.0
os = "linux"
cpus = 8
memory_mb = 16000
storage_mb = 20000
# One GPU, and the reason is a consequence of fixing the task rather than a
# compute complaint. The first cut was CPU-only with 8,000 training pairs, and at
# that scale the whole measured band was response length: "pick the longer
# response" scored 0.6031 on the helpful holdout against a full fine-tune's
# 0.6042, and a randomly-initialized encoder was within seed noise of a
# pretrained one. Length-balancing removed the shortcut, and a model that has to
# judge content instead of length needs far more data -- the frozen probe alone
# moves 0.5778 -> 0.6055 between 8,000 and 38,420 pairs. Two epochs over 38,420
# pairs is 6.7 hours on 8 CPU cores at the measured 2.85 pairs/s, so CPU-only
# would have meant keeping the task at a size where nothing separates the arms.
gpus = 1

[environment.env]
OMP_NUM_THREADS = "8"
PYTHONHASHSEED = "0"
TOKENIZERS_PARALLELISM = "false"

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"

[verifier.environment]
# Baseline no-network, not a phase override: plain Docker does not support
# dynamic network policy, so the verifier image must ship its data pre-baked.
network_mode = "no-network"
build_timeout_sec = 1800.0
os = "linux"
cpus = 8
memory_mb = 16000
storage_mb = 20000
gpus = 0

[verifier.environment.env]
# Four threads, not one: this grader runs ~8,000 forward passes over 256-token
# dialogues. The count is pinned here and in tests/Dockerfile, so it is constant
# across regrades - which is what determinism requires, not that it equal 1.
OMP_NUM_THREADS = "4"
MKL_NUM_THREADS = "4"
PYTHONHASHSEED = "0"
TOKENIZERS_PARALLELISM = "false"
HF_HUB_OFFLINE = "1"

[solution.env]
OMP_NUM_THREADS = "8"
