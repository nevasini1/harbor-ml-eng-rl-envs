schema_version = "1.4"

# Agent submission transferred into the separate verifier at the same path.
artifacts = ["/app/final_model"]

[task]
name = "mleval/sciml-protein-regression"
version = "1.0.0"
description = "Fine-tune ESM-2-8M on Meltome protein thermostability; maximize Spearman on a private held-out split (1 GPU, 4h)."
authors = [{ name = "mleval", email = "mleval@example.com" }]

[metadata]
category = "scientific-ml"
subcategory = "protein-property-regression"
tags = ["protein", "esm2", "gpu", "fine-tuning", "flip2", "meltome"]

[agent]
timeout_sec = 14400

[verifier]
timeout_sec = 3600
environment_mode = "separate"

[verifier.environment]
cpus = 4
# Must stay at or below the host Docker VM (11.7GB locally), otherwise the cgroup
# limit never binds: instead of a clean in-container OOM that kills grade.py and
# lets test.sh write a 0 reward, the host thrashes and takes the whole container,
# leaving no reward.json at all -- which Harbor's metric scores as 0 anyway but
# records as a trial error.
memory_mb = 8192
storage_mb = 40960
gpus = 0
# The grader needs nothing from the network: the base model is baked into the
# image at /grader/base_model and the private split at /tests/private_test.
network_mode = "no-network"
build_timeout_sec = 1800.0

[environment]
cpus = 4
memory_mb = 24576
storage_mb = 40960
# One GPU. This task was specified CPU-only, and that is what made it
# unrunnable: meltome-mixed has a median sequence length of 413 aa (p95 1,377),
# so at 512 tokens embedding throughput falls to ~6 seq/s and a single forward
# pass over the corpus takes ~85 minutes -- about 35% of a 4-hour budget for one
# featurization with no training. solution/solve.sh is a 4-epoch full fine-tune
# over ~20k sequences, which on CPU is on the order of ten hours; the oracle
# could never finish inside its own budget.
#
# This fixes feasibility only. It does NOT fix the task. The inversion was
# measured on GPU: across two splits, 13 frozen seeds and 7 fine-tune seeds at
# std ~0.003, a frozen probe scores 0.55-0.58 while a fine-tune scores 0.52-0.53
# (-7.5 and -12.2 sigma). Compute was never the reason fine-tuning loses here.
gpus = 1
# The private test set is the public FLIP2 meltome-mixed file minus the rows
# shipped as /data/train.csv.gz. With egress, an agent recovers it exactly by set
# difference -- verified at 100% recall and precision, with public labels
# rank-correlating 0.9998 with the private ground truth. No rule in
# instruction.md can prevent that; only removing egress can. The agent needs
# nothing from the network: base model at /models, data at /data.
#
# WARNING: this is NOT enforced on macOS. Harbor gates egress control on
# `sys.platform == "linux" or _egress_control_kernel_support()`
# (harbor/environments/docker/docker.py:194); Docker Desktop's VM fails the
# nftables probe, so the sidecar is never attached and this setting is silently
# ignored -- no error, no warning. Verified: zenodo.org and huggingface.co are
# both reachable from inside the agent container on this host. Only trust runs
# executed on a Linux host or a provider with real egress control.
network_mode = "no-network"
build_timeout_sec = 1800.0
